{% extends 'base.html' %}
{% block title %}Register · To‑Do{% endblock %}
{% block body %}
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
  <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 sun-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
  </svg>
  <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 moon-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
  </svg>
</button>
<main class="min-h-full flex items-center justify-center p-6">
  <div class="w-full max-w-md glass rounded-2xl shadow-xl ring-1 themed-border p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="h-10 w-10 rounded-xl themed-badge-bg ring-1 themed-badge-ring grid place-items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 themed-icon">
          <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h15a3 3 0 013 3v15a3 3 0 01-3 3h-15a3 3 0 01-3-3v-15zm5.47 7.97a.75.75 0 011.06 0L10.5 13.94l5.47-5.47a.75.75 0 011.06 1.06l-6 6a.75.75 0 01-1.06 0l-3-3a.75.75 0 010-1.06z" clip-rule="evenodd" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-semibold themed-text-primary">Create your account</h1>
        <p class="text-sm themed-text-muted">Start organizing your day</p>
      </div>
    </div>

    {% if error %}
      <div class="mb-4 rounded-lg bg-red-500/10 text-red-200 px-4 py-2 ring-1 ring-red-400/30">{{ error }}</div>
    {% endif %}

    <form method="post" class="space-y-4">
      <div>
        <label class="block text-sm mb-1 themed-text-secondary" for="username">Username</label>
        <input id="username" name="username" required autofocus
               class="w-full rounded-xl themed-input ring-1 focus:ring-brand-400/50 outline-none px-3 py-2"
               placeholder="jane" />
      </div>
      <div>
        <label class="block text-sm mb-1 themed-text-secondary" for="password">Password</label>
        <input id="password" name="password" type="password" required
               class="w-full rounded-xl themed-input ring-1 focus:ring-brand-400/50 outline-none px-3 py-2"
               placeholder="••••••••" />
      </div>
      <div>
        <label class="block text-sm mb-1 themed-text-secondary" for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" required
               class="w-full rounded-xl themed-input ring-1 focus:ring-brand-400/50 outline-none px-3 py-2"
               placeholder="••••••••" />
      </div>
      <button class="w-full rounded-xl bg-brand-500 hover:bg-brand-400 text-white font-medium py-2 transition">Create account</button>
    </form>

    <p class="mt-6 text-center text-sm themed-text-muted">Have an account? <a class="text-brand-400 hover:text-brand-500 font-medium" href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script>
  // Theme management
  function initTheme() {
    const savedTheme = localStorage.getItem('theme') || 'dark';
    setTheme(savedTheme);
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    updateThemeToggleIcon(theme);
  }

  function updateThemeToggleIcon(theme) {
    const sunIcon = document.querySelector('.sun-icon');
    const moonIcon = document.querySelector('.moon-icon');

    if (theme === 'light') {
      sunIcon.style.display = 'none';
      moonIcon.style.display = 'block';
    } else {
      sunIcon.style.display = 'block';
      moonIcon.style.display = 'none';
    }
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    setTheme(newTheme);
  }

  // Initialize theme on page load
  initTheme();

  // Theme toggle event listener
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
</script>
{% endblock %}
