{% extends 'base.html' %}
{% block title %}To‑Do{% endblock %}
{% block body %}
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
  <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 sun-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
  </svg>
  <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 moon-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="display: none;">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
  </svg>
</button>
<header class="px-6 pt-6">
  <div class="max-w-3xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl themed-badge-bg ring-1 themed-badge-ring grid place-items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 themed-icon">
          <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h15a3 3 0 013 3v15a3 3 0 01-3 3h-15a3 3 0 01-3-3v-15zm5.47 7.97a.75.75 0 011.06 0L10.5 13.94l5.47-5.47a.75.75 0 011.06 1.06l-6 6a.75.75 0 01-1.06 0l-3-3a.75.75 0 010-1.06z" clip-rule="evenodd" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl font-semibold leading-tight" style="color: var(--text-primary)">Your Tasks</h1>
        <p class="text-sm themed-text-muted">Signed in as <span class="font-medium themed-text-secondary">{{ user.username }}</span></p>
      </div>
    </div>
    <form action="{{ url_for('logout') }}" method="post">
      <button class="rounded-xl themed-button ring-1 themed-border px-4 py-2 text-sm transition">Log out</button>
    </form>
  </div>
</header>

<main class="px-6 py-6">
  <div class="max-w-3xl mx-auto glass rounded-2xl shadow-xl ring-1 themed-border p-6">
    <div class="flex gap-3 items-center">
      <div class="flex-1">
        <label for="new-todo" class="sr-only">Add a task</label>
        <input id="new-todo" class="w-full rounded-xl themed-input ring-1 focus:ring-brand-400/50 outline-none px-4 py-3" placeholder="What needs to be done?" />
      </div>
      <button id="add-btn" class="shrink-0 rounded-xl bg-brand-500 hover:bg-brand-400 text-white font-medium px-4 py-3 transition">Add</button>
    </div>

    <div class="mt-6 flex items-center justify-between">
      <div class="text-sm themed-text-muted"><span id="left-count">0</span> items left</div>
      <div class="flex gap-2 text-sm">
        <button data-filter="all" class="filter-btn rounded-lg px-3 py-1 ring-1 themed-border themed-button">All</button>
        <button data-filter="active" class="filter-btn rounded-lg px-3 py-1 ring-1 themed-border hover:themed-button themed-text-muted">Active</button>
        <button data-filter="completed" class="filter-btn rounded-lg px-3 py-1 ring-1 themed-border hover:themed-button themed-text-muted">Completed</button>
      </div>
      <button id="clear-completed" class="text-sm themed-text-muted hover:themed-text-secondary">Clear completed</button>
    </div>

    <ul id="list" class="mt-4 divide-y themed-divider"></ul>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/sounds.js') }}"></script>
<script src="{{ url_for('static', filename='js/celebration.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
{% endblock %}
