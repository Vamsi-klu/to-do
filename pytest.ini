[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=json
    --cov-fail-under=95
    --ignore=.venv
    --ignore=venv
    --ignore=env
markers =
    unit: Unit tests
    integration: Integration tests
    ai: AI feature tests
